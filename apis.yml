name: Pheon Therapeutics
description: Pheon Therapeutics is a preclinical-stage oncology biotechnology company developing next-generation
  antibody-drug conjugates (ADCs) for a wide range of hard-to-treat solid tumors. Leveraging two decades of ADC
  experience, Pheon arms monoclonal antibodies against both novel and clinically validated targets with warheads
  from its proprietary payload platform, which offers a novel mechanism of action, or with off-the-shelf
  linker-payload combinations, balancing safety and efficacy for each target. The company is privately held and
  backed by specialist healthcare investors. Pheon publishes a corporate and scientific web presence only; it
  exposes no public developer API, SDKs, documentation, or well-known API discovery surface.
